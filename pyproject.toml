[project]
name = "titanic"
version = "0.1.0"
description = "Titanic full-stack: React + FastAPI + scikit-learn"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "joblib>=1.5",
    "pandas>=3.0",
    "pydantic-settings>=2",
    "scikit-learn>=1.9",
    "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
    "ipykernel>=6",
    "jupyter>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"